# Publishes the dashboard to GitHub Pages. The Airtable token is not in the repository:
# it is stored as the repository secret AIRTABLE_TOKEN and written into airtable-config.js
# only inside the published copy.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the site folder
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          test -n "$AIRTABLE_TOKEN" || { echo "The secret AIRTABLE_TOKEN is not set."; exit 1; }
          mkdir _site
          cp -r index.html styles.css src data _site/
          cat > _site/airtable-config.js <<EOF
          window.AIRTABLE_CONFIG = {
            token: "${AIRTABLE_TOKEN}",
            baseId: "appebfLHM5VJ3mBcI",
            tableId: "tblBy3u1dAeJtFCGW"
          };
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
